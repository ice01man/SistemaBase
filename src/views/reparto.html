<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entregas · Sistema BRIE</title>
<link rel="stylesheet" href="css/brie.css" />
</head>
<body>
<div id="navbar"></div>
<main class="container" style="padding:2rem 1rem;">
  <div class="barra-herramientas">
    <h1 class="seccion-titulo">Entregas</h1>
    <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;">
      <span id="actualizado" style="font-size:.75rem; opacity:.6;"></span>
      <button class="btn-outline" onclick="cargar()">↻ Actualizar</button>
    </div>
  </div>
  <div id="mis-zonas" style="margin-top:.75rem; font-size:.9rem;"></div>
  <div id="contenido" class="kanban" style="margin-top:1.25rem;"></div>
</main>

<script src="js/api.js"></script>
<script src="js/constants.js"></script>
<script src="js/navbar.js"></script>
<script>
  let usuario = null;

  async function init() {
    usuario = requireRol("admin", "reparto", "user");
    if (!usuario) return;
    await cargar();
    setInterval(cargar, 20000);
  }

  function mapaUrl(dir) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`; }

  function ticket(p) {
    const listo = p.estado === "producido";
    const hoy = hoyISO();
    return `
    <div class="card ticket ${listo ? "" : "preparando"}">
      <div class="cab">
        <span class="num">#${p.numero ?? p._id.slice(-6)}</span>
        <span class="meta">${p.fechaEntrega === hoy ? "<b>HOY</b>" : fmtFechaEntrega(p.fechaEntrega)}</span>
      </div>
      <div class="items">${p.items.map((i) => `<div><b>${i.qty} ×</b> ${esc(i.name)}</div>`).join("")}</div>
      <div style="font-size:.9rem;">
        ${p.zona ? `<span class="badge" style="background:#e0f2fe;color:#075985;">🗺️ ${esc(p.zona)}</span><br>` : ""}
        👤 <b>${esc(p.cliente?.nombre ?? "")}</b>${p.cliente?.telefono ? ` · <a href="tel:${esc(p.cliente.telefono)}" style="color:var(--brie-violet); font-weight:800;">${esc(p.cliente.telefono)}</a>` : ""}<br>
        📍 <a href="${mapaUrl(p.direccion)}" target="_blank" rel="noopener" style="color:var(--brie-violet); font-weight:800; text-decoration:underline;">${esc(p.direccion)}</a>
      </div>
      ${p.observaciones ? `<div class="nota">📝 ${esc(p.observaciones)}</div>` : ""}
      <div class="nota" style="background:${p.pagado || p.medioPago === "transferencia" ? "#f0fdf4" : "#fffbeb"};">
        💳 ${esc(MEDIO_PAGO_LABEL[p.medioPago])} · ${p.pagado ? "ya cobrado ✅" : p.medioPago === "efectivo" ? `<b>cobrar ${fmtPrecio(p.totalAmount)} en efectivo</b>` : `verificar transferencia de ${fmtPrecio(p.totalAmount)}`}
      </div>
      <div class="acciones">
        <span class="meta">${listo ? "Esperando repartidor" : `Lo lleva ${esc(p.repartidor ?? "")}`}</span>
        ${listo
          ? `<button class="btn-orange" onclick="mover('${p._id}','en_camino')">🛵 Salir a entregar</button>`
          : `${p.medioPago === "efectivo" && !p.pagado ? `<button class="btn-orange" onclick="cobrar('${p._id}')">💵 Cobré ${fmtPrecio(p.totalAmount)}</button>` : ""}
             <button class="btn-primary" onclick="mover('${p._id}','entregado', ${p.medioPago === "efectivo" && !p.pagado})">✔ Entregado</button>`}
      </div>
    </div>`;
  }

  async function cargar() {
    try {
      const [pedidos, yo, cfg] = await Promise.all([apiGet("/orders/reparto"), apiGet("/auth/me"), apiGet("/config")]);
      // Si hay zonas creadas, el repartidor solo ve las suyas: se le muestra cuáles son (o que todavía no tiene).
      const reparte = yo.role === "reparto" || yo.role === "user";
      const zonasMias = yo.zonasReparto || [];
      document.getElementById("mis-zonas").innerHTML = !reparte || !(cfg.zonas || []).length ? ""
        : zonasMias.length ? `🗺️ Tus zonas: <b>${zonasMias.map(esc).join(", ")}</b>`
        : `<b>⚠️ Todavía no tenés zonas asignadas.</b> Pedile al administrador que te asigne las zonas que repartís: hasta entonces no vas a ver pedidos.`;
      const listos = pedidos.filter((p) => p.estado === "producido");
      const camino = pedidos.filter((p) => p.estado === "en_camino");
      document.getElementById("contenido").innerHTML = `
        <div><h2>📦 Listos para retirar (${listos.length})</h2>
          <div style="display:flex; flex-direction:column; gap:.75rem;">
            ${listos.map(ticket).join("") || `<div class="card" style="text-align:center; opacity:.7;">No hay pedidos listos todavía.</div>`}
          </div></div>
        <div><h2>🛵 En camino (${camino.length})</h2>
          <div style="display:flex; flex-direction:column; gap:.75rem;">
            ${camino.map(ticket).join("") || `<div class="card" style="text-align:center; opacity:.7;">Nada en camino.</div>`}
          </div></div>`;
      document.getElementById("actualizado").textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    } catch (err) { toast(err.message, "error"); }
  }

  // `efectivoSinCobrar`: si entrega un pedido en efectivo sin haber registrado el cobro, se le avisa (no se le impide).
  async function mover(id, estado, efectivoSinCobrar = false) {
    if (estado === "entregado" && efectivoSinCobrar &&
        !confirm("Todavía no registraste el cobro en efectivo de este pedido.\n\n¿Marcarlo como entregado igual? Va a quedar como \"A cobrar en efectivo\" para que se confirme después.")) return;
    try {
      await apiPatch(`/orders/${id}/estado`, { estado });
      toast(estado === "entregado" ? "Entrega registrada ✅" : "¡Buen viaje! 🛵");
    } catch (err) { toast(err.message, "error"); }
    await cargar();
  }

  // El repartidor registra que cobró el efectivo (queda guardado quién y cuándo). Es independiente de la entrega.
  async function cobrar(id) {
    try {
      await apiPatch(`/orders/${id}/pago`, { pagado: true });
      toast("Cobro en efectivo registrado 💵");
    } catch (err) { toast(err.message, "error"); }
    await cargar();
  }

  init();
</script>
</body>
</html>
