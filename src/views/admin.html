<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Administración · SistemaBRIE</title>
<link rel="stylesheet" href="css/brie.css" />
</head>
<body>
<div id="navbar"></div>

<main class="container">
  <div class="db-layout">
    <nav class="db-sidebar">
      <a href="#resumen"   data-tab="resumen"   class="activo">📊 Resumen</a>
      <a href="#pedidos"   data-tab="pedidos">🧾 Pedidos</a>
      <a href="#productos" data-tab="productos">🍽️ Platos y recetas</a>
      <a href="#insumos"   data-tab="insumos">📦 Insumos y stock</a>
      <a href="#usuarios"  data-tab="usuarios">👥 Usuarios</a>
      <a href="#ajustes"   data-tab="ajustes">⚙️ Ajustes</a>
      <hr style="border:none; border-top:1px solid var(--brie-lavender-light); width:100%;" />
      <a href="/cocina">👩‍🍳 Ir a Cocina</a>
      <a href="/reparto">🛵 Ir a Reparto</a>
    </nav>
    <div class="db-content">
      <section id="tab-resumen"></section>
      <section id="tab-pedidos" style="display:none;"></section>
      <section id="tab-productos" style="display:none;"></section>
      <section id="tab-insumos" style="display:none;"></section>
      <section id="tab-usuarios" style="display:none;"></section>
      <section id="tab-ajustes" style="display:none;"></section>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/constants.js"></script>
<script src="js/navbar.js"></script>
<!-- Módulos de cada pestaña (los sirve el servidor solo a un admin con sesión) -->
<script src="/admin/js/resumen.js"></script>
<script src="/admin/js/pedidos.js"></script>
<script src="/admin/js/productos.js"></script>
<script src="/admin/js/insumos.js"></script>
<script src="/admin/js/usuarios.js"></script>
<script src="/admin/js/ajustes.js"></script>
<script>
  const TABS = {
    resumen: cargarResumen, pedidos: cargarPedidos, productos: cargarProductos,
    insumos: cargarInsumos, usuarios: cargarUsuarios, ajustes: cargarAjustes,
  };
  let usuarioActual = null;

  function irATab(nombre) {
    if (!TABS[nombre]) nombre = "resumen";
    document.querySelectorAll(".db-sidebar a[data-tab]").forEach((a) => a.classList.toggle("activo", a.dataset.tab === nombre));
    document.querySelectorAll(".db-content > section").forEach((s) => (s.style.display = s.id === `tab-${nombre}` ? "block" : "none"));
    Promise.resolve(TABS[nombre]()).catch((err) => toast(err.message, "error"));
  }

  function init() {
    usuarioActual = requireRol("admin");
    if (!usuarioActual) return;
    document.querySelectorAll(".db-sidebar a[data-tab]").forEach((a) => {
      a.addEventListener("click", (e) => { e.preventDefault(); location.hash = a.dataset.tab; });
    });
    window.addEventListener("hashchange", () => irATab(location.hash.slice(1)));
    irATab(location.hash.slice(1));
  }
  init();
</script>
</body>
</html>
