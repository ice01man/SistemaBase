<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hacer un pedido · Sistema BRIE</title>
<link rel="stylesheet" href="css/brie.css" />
<style>
  .pedir-layout { display:grid; gap:1.5rem; margin-top:1.5rem; padding-bottom:6rem; }
  @media (min-width: 1024px) { .pedir-layout { grid-template-columns: 1fr 360px; padding-bottom:0; } }
  .resumen-card { position: sticky; top: 5rem; height: fit-content; }
  .barra-flotante {
    position:fixed; left:0.75rem; right:0.75rem; bottom:0.75rem; z-index:40;
    display:flex; align-items:center; justify-content:space-between; gap:0.75rem;
    border-radius:1rem; background:var(--brie-solid); color:#fff; padding:0.75rem 1rem;
    box-shadow:0 15px 30px rgba(69,58,107,0.3); cursor:pointer; border:none;
  }
  @media (min-width: 1024px) { .barra-flotante { display:none; } }
  .linea { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
  .linea-nombre { flex:1; }
</style>
</head>
<body>
<div id="navbar"></div>

<main class="container" style="padding:2.5rem 1rem;">
  <h1 style="font-size:1.875rem; font-weight:800; color:var(--brie-violet-deep);">Hacer un pedido</h1>
  <p id="aviso-corte" style="opacity:0.75; margin-top:0.25rem;"></p>
  <div id="dias" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1.5rem;"></div>
  <div id="filtros" style="margin-top:1rem;"></div>
  <div id="contenido" class="pedir-layout"></div>
</main>

<button id="barra-mobile" class="barra-flotante" style="display:none;" onclick="document.getElementById('resumen').scrollIntoView({behavior:'smooth'})">
  <span id="barra-mobile-texto"></span>
  <span style="background:rgba(255,255,255,0.2); border-radius:0.75rem; padding:0.4rem 0.75rem; font-size:0.75rem; font-weight:800;">Ver mi pedido ↓</span>
</button>

<script src="js/api.js"></script>
<script src="js/constants.js"></script>
<script src="js/foodcard.js"></script>
<script src="js/navbar.js"></script>
<script>
  let usuario = null;
  let diaActual = DIAS.includes(diaDeHoy()) ? diaDeHoy() : "lunes";
  let categoriaActual = "Todos";
  let productos = [];
  let entregas = {};          // { lunes: '2026-11-09', ... } lo calcula el servidor
  let horaCorte = 10;
  let medioPago = "efectivo";
  let pedibles = DIAS;        // días que se pueden pedir ahora (lo decide el servidor)
  let soloHoy = false;
  let diaHoySrv = "";
  const puedePedir = (d) => pedibles.includes(d);
  // Carrito persistente (sobrevive a recargar la página): { [dia]: { [productId]: cantidad } }
  let carrito = {};

  const guardarCarrito = () => localStorage.setItem("sb_cart", JSON.stringify(carrito));
  const cartDia = () => (carrito[diaActual] ??= {});

  async function init() {
    usuario = requireRol("cliente", "admin");
    if (!usuario) return;
    try { carrito = JSON.parse(localStorage.getItem("sb_cart") || "{}") || {}; } catch { carrito = {}; }
    try {
      const f = await apiGet("/orders/fechas");
      entregas = f.entregas; horaCorte = f.horaCorte; pedibles = f.pedibles; soloHoy = f.soloPedidoDelDia; diaHoySrv = f.diaHoy;
      if (soloHoy && puedePedir(f.diaHoy)) diaActual = f.diaHoy; // arranca en el día que sí se puede pedir
    } catch { /* sin fechas: se muestra igual el menú */ }
    const hh = `${String(horaCorte).padStart(2, "0")}:00`;
    document.getElementById("aviso-corte").textContent = soloHoy
      ? (pedibles.length
          ? `Hoy se puede pedir el menú de hoy hasta las ${hh}. Los demás días son solo para ver.`
          : `Hoy no se reciben pedidos (fuera del horario o día no laborable). Podés mirar el menú de cada día.`)
      : `Pedidos hasta las ${hh} del día de entrega. Después del corte, el pedido pasa a la semana siguiente.`;
    await cargarDia();
  }

  async function cargarDia(dia) {
    diaActual = dia ?? diaActual;
    categoriaActual = "Todos";
    document.getElementById("dias").innerHTML = DIAS.map((d) => {
      const n = Object.values(carrito[d] ?? {}).reduce((a, c) => a + c, 0);
      return `<button class="chip ${d === diaActual ? "activo" : ""}" onclick="cargarDia('${d}')">${DIA_LABEL[d]}${puedePedir(d) ? (n ? ` · ${n}` : "") : " 👁"}</button>`;
    }).join("");
    productos = await apiGet(`/products/by-day?day=${diaActual}`);
    // Limpia del carrito platos que ya no existen / se desactivaron
    const vivos = new Set(productos.map((p) => p._id));
    for (const id of Object.keys(cartDia())) if (!vivos.has(id)) delete cartDia()[id];
    guardarCarrito();
    render();
  }

  function filtrarCategoria(cat) { categoriaActual = cat; render(); }

  function setCantidad(id, valor) {
    const v = Math.min(50, Math.max(0, valor));
    if (v === 0) delete cartDia()[id]; else cartDia()[id] = v;
    guardarCarrito();
    // refresca chips (contador por día) sin volver a pedir el menú
    document.getElementById("dias").innerHTML = DIAS.map((d) => {
      const n = Object.values(carrito[d] ?? {}).reduce((a, c) => a + c, 0);
      return `<button class="chip ${d === diaActual ? "activo" : ""}" onclick="cargarDia('${d}')">${DIA_LABEL[d]}${puedePedir(d) ? (n ? ` · ${n}` : "") : " 👁"}</button>`;
    }).join("");
    render();
  }

  function footerPedir(p) {
    if (!puedePedir(diaActual)) {
      return `<span class="fc-price">${fmtPrecio(p.price)}</span>
              <button class="btn-outline" disabled title="Solo se puede pedir el menú de hoy">Solo para ver</button>`;
    }
    const cantidad = cartDia()[p._id] ?? 0;
    if (cantidad === 0) {
      return `<span class="fc-price">${fmtPrecio(p.price)}</span>
              <button class="btn-orange" onclick="setCantidad('${p._id}', 1)">+ Agregar</button>`;
    }
    return `<span class="fc-price">${fmtPrecio(p.price)}</span>
            <div class="qty-stepper">
              <button class="btn-outline qty-btn" onclick="setCantidad('${p._id}', ${cantidad - 1})">−</button>
              <span style="width:1.5rem; text-align:center; font-weight:800;">${cantidad}</span>
              <button class="btn-primary qty-btn" onclick="setCantidad('${p._id}', ${cantidad + 1})">+</button>
            </div>`;
  }

  function render() {
    // No re-renderizar el formulario mientras escribe: se conservan los valores.
    const dirPrev = document.getElementById("dir")?.value;
    const obsPrev = document.getElementById("obs")?.value;

    document.getElementById("filtros").innerHTML = productos.length
      ? renderFiltrosCategoria(productos, categoriaActual, "filtrarCategoria") : "";

    const cont = document.getElementById("contenido");
    if (productos.length === 0) {
      cont.innerHTML = `<div class="card" style="text-align:center; opacity:0.7;">Todavía no hay platos cargados para el ${DIA_LABEL[diaActual].toLowerCase()}.</div>`;
      document.getElementById("barra-mobile").style.display = "none";
      return;
    }

    const items = puedePedir(diaActual) ? Object.entries(cartDia()).filter(([, c]) => c > 0) : [];
    const total = items.reduce((acc, [id, c]) => acc + (productos.find((p) => p._id === id)?.price ?? 0) * c, 0);
    const totalItems = items.reduce((a, [, c]) => a + c, 0);
    const visibles = categoriaActual === "Todos" ? productos : productos.filter((p) => p.category === categoriaActual);
    const entrega = entregas[diaActual];

    cont.innerHTML = `
      <div class="cards-grid">${visibles.map((p) => renderFoodCard(p, footerPedir(p))).join("")}</div>

      ${!puedePedir(diaActual) ? `<div id="resumen" class="card resumen-card">
        <h3 style="margin:0; color:var(--brie-violet-deep); font-weight:800;">👁 Solo para ver</h3>
        <p style="font-size:.9rem;">${soloHoy && diaHoySrv && diaActual !== diaHoySrv && pedibles.length
          ? `Hoy es <b>${DIA_LABEL[diaHoySrv] ?? diaHoySrv}</b>: solo se puede pedir el menú de hoy.`
          : `Ahora no se reciben pedidos (pasó el horario de corte o hoy no es día de menú).`}</p>
        ${pedibles.length ? `<button class="btn-orange" type="button" onclick="cargarDia('${pedibles[0]}')">Ir al menú de hoy</button>` : ""}
      </div>` : `<form id="resumen" class="card resumen-card" onsubmit="return confirmarPedido(event)">
        <h3 style="margin:0; color:var(--brie-violet-deep); font-weight:800; font-size:1.125rem;">🛒 Tu pedido</h3>
        <p style="font-size:0.875rem; opacity:0.8;">Menú del ${DIA_LABEL[diaActual].toLowerCase()}${entrega ? ` · <b>entrega ${fmtFechaEntrega(entrega)}</b>` : ""}</p>

        <div style="border-bottom:1px solid var(--brie-lavender-light); padding-bottom:0.75rem; margin-top:0.75rem; font-size:0.875rem; display:flex; flex-direction:column; gap:.35rem;">
          ${items.length === 0
            ? `<p style="opacity:0.6; margin:0;">Todavía no agregaste platos.</p>`
            : items.map(([id, c]) => {
                const p = productos.find((x) => x._id === id);
                return `<div class="linea">
                  <span class="linea-nombre">${esc(p.name)}</span>
                  <span class="qty-stepper">
                    <button type="button" class="btn-outline qty-btn" onclick="setCantidad('${id}', ${c - 1})">−</button>
                    <b style="min-width:1.2rem; text-align:center;">${c}</b>
                    <button type="button" class="btn-primary qty-btn" onclick="setCantidad('${id}', ${c + 1})">+</button>
                  </span>
                  <span data-linea="${id}" style="font-weight:800; min-width:4.5rem; text-align:right;">${fmtPrecio(p.price * c)}</span>
                </div>`;
              }).join("")}
        </div>

        <div id="cot-detalle" style="margin-top:.5rem;">
          <div class="linea" style="font-size:1.125rem; font-weight:800; color:var(--brie-violet-deep);">
            <span>Total</span><span>${fmtPrecio(total)}</span>
          </div>
        </div>

        <label class="label" style="margin-top:1rem;">Dirección de entrega *</label>
        <input class="input" id="dir" required maxlength="200" placeholder="Calle, número, localidad" value="${esc(dirPrev ?? usuario.direccion ?? "")}" />
        <label class="label" style="margin-top:.6rem;">Observaciones (opcional)</label>
        <input class="input" id="obs" maxlength="300" placeholder="Timbre, sin cebolla, horario..." value="${esc(obsPrev ?? "")}" />
        <label class="label" style="margin-top:.6rem;">Medio de pago</label>
        <select class="input" id="pago" onchange="medioPago=this.value">
          ${Object.entries(MEDIO_PAGO_LABEL).map(([k, v]) => `<option value="${k}" ${k === medioPago ? "selected" : ""}>${v}</option>`).join("")}
        </select>

        <div id="pedido-error"></div>
        <button class="btn-orange" style="width:100%; margin-top:1rem; padding:0.75rem;" ${items.length === 0 ? "disabled" : ""} id="btn-confirmar">
          Confirmar pedido · ${fmtPrecio(total)}
        </button>
        <p style="font-size:.75rem; opacity:.65; margin:.5rem 0 0;">El precio final (con descuentos) lo calcula el servidor.</p>
      </form>`}
    `;

    const barra = document.getElementById("barra-mobile");
    if (items.length > 0 && puedePedir(diaActual)) {
      barra.style.display = "flex";
      document.getElementById("barra-mobile-texto").textContent = `🛒 ${totalItems} ${totalItems === 1 ? "plato" : "platos"} · ${fmtPrecio(total)}`;
    } else {
      barra.style.display = "none";
    }
    if (items.length > 0 && puedePedir(diaActual)) actualizarCotizacion();
  }

  // Pide al servidor el precio real (según el tipo de cliente: final, empresa o con descuento) y lo pinta.
  // Es el MISMO cálculo que se usa al confirmar, así que lo que se ve es lo que se cobra.
  let cotSeq = 0;
  async function actualizarCotizacion() {
    const mi = ++cotSeq;
    const items = Object.entries(cartDia()).filter(([, c]) => c > 0).map(([productId, qty]) => ({ productId, qty }));
    if (!items.length) return;
    let cot;
    try { cot = await apiPost("/orders/cotizar", { dia: diaActual, items }); } catch { return; } // si falla, queda el total provisorio
    if (mi !== cotSeq) return; // llegó una cotización más vieja que otra ya pedida
    const det = document.getElementById("cot-detalle");
    if (!det) return;
    det.innerHTML = `
      ${cot.descuentoPct > 0 ? `
        <div class="linea sutil linea-desc sutil"><span>Subtotal a precio público</span><span>${fmtPrecio(cot.subtotal)}</span></div>
        <div class="linea linea-desc"><span>🏷 ${esc(cot.descuentoMotivo)} (ahorrás ${String(cot.descuentoPct).replace(".", ",")} %)</span><span>− ${fmtPrecio(cot.descuentoMonto)}</span></div>` : ""}
      <div class="linea" style="font-size:1.125rem; font-weight:800; color:var(--brie-violet-deep);">
        <span>Total</span><span>${fmtPrecio(cot.total)}</span>
      </div>`;
    // cada línea muestra el precio que le toca a este cliente (puede ser distinto al público)
    for (const it of cot.items) {
      const el = document.querySelector(`[data-linea="${it.productId}"]`);
      if (el) el.textContent = fmtPrecio(it.price * it.qty);
    }
    const btn = document.getElementById("btn-confirmar");
    if (btn && !btn.disabled) btn.textContent = `Confirmar pedido · ${fmtPrecio(cot.total)}`;
    const t = document.getElementById("barra-mobile-texto");
    if (t) t.textContent = `🛒 ${cot.porciones} ${cot.porciones === 1 ? "plato" : "platos"} · ${fmtPrecio(cot.total)}`;
  }

  async function confirmarPedido(e) {
    e.preventDefault();
    const btn = document.getElementById("btn-confirmar");
    const errorEl = document.getElementById("pedido-error");
    errorEl.innerHTML = "";
    // Solo se manda QUÉ y CUÁNTO: el servidor pone nombres, precios y total.
    const items = Object.entries(cartDia()).filter(([, c]) => c > 0).map(([productId, qty]) => ({ productId, qty }));
    if (items.length === 0) return false;
    const direccion = document.getElementById("dir").value.trim();
    const observaciones = document.getElementById("obs").value.trim();

    btn.disabled = true; btn.textContent = "Confirmando...";
    try {
      await apiPost("/orders", { dia: diaActual, items, direccion, observaciones, medioPago });
      delete carrito[diaActual];
      guardarCarrito();
      // guarda la dirección como predeterminada para la próxima vez
      try { await apiPatch("/auth/me", { direccion }); } catch { /* no es crítico */ }
      location.href = "mis-pedidos.html?nuevo=1";
    } catch (err) {
      errorEl.innerHTML = `<p class="msg-error" style="margin-top:0.75rem;">${esc(err.message)}</p>`;
      btn.disabled = false; btn.textContent = "Confirmar pedido";
    }
    return false;
  }

  init();
</script>
</body>
</html>
