<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menú semanal · SistemaBase</title>
<link rel="stylesheet" href="css/brie.css" />
</head>
<body>
<div id="navbar"></div>
<main class="container" style="padding:2.5rem 1rem;">
  <h1 style="font-size:1.875rem; font-weight:800; color:var(--brie-violet-deep);">Menú semanal</h1>
  <p style="opacity:0.7; margin-top:0.25rem;">Elegí un día y filtrá por categoría.</p>

  <div id="dias" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1.5rem;"></div>
  <div id="filtros" style="margin-top:1rem;"></div>
  <div id="menu" class="cards-grid"></div>
</main>

<script src="js/api.js"></script>
<script src="js/constants.js"></script>
<script src="js/foodcard.js"></script>
<script src="js/navbar.js"></script>
<script>
  let diaActual = DIAS.includes(diaDeHoy()) ? diaDeHoy() : "lunes";
  let categoriaActual = "Todos";
  let productosDelDia = [];

  async function cargarDia(dia) {
    diaActual = dia ?? diaActual;
    categoriaActual = "Todos";
    document.getElementById("dias").innerHTML = DIAS.map(
      (d) => `<button class="chip ${d === diaActual ? "activo" : ""}" onclick="cargarDia('${d}')">${DIA_LABEL[d]}</button>`
    ).join("");

    productosDelDia = await apiGet(`/products/by-day?day=${diaActual}`);
    render();
  }

  function filtrarCategoria(cat) {
    categoriaActual = cat;
    render();
  }

  function render() {
    document.getElementById("filtros").innerHTML = productosDelDia.length
      ? renderFiltrosCategoria(productosDelDia, categoriaActual, "filtrarCategoria")
      : "";

    const cont = document.getElementById("menu");
    if (productosDelDia.length === 0) {
      cont.innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center; opacity:0.7;">Todavía no hay platos cargados para el ${DIA_LABEL[diaActual].toLowerCase()}.</div>`;
      return;
    }
    const visibles = categoriaActual === "Todos" ? productosDelDia : productosDelDia.filter((p) => p.category === categoriaActual);
    cont.innerHTML = visibles
      .map((p) => renderFoodCard(p, `<span class="fc-price">${fmtPrecio(p.price)}</span>`))
      .join("");
  }

  cargarDia();
</script>
</body>
</html>
