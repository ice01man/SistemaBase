<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Asegúrate de tener este archivo CSS -->
<!--<link rel="stylesheet" href="./css/style.css"> -->
<link rel="stylesheet" href="./css/newstyle.css">
</head>
<body>

<!-- Contenedor de Notificaciones -->
<div id="toast-container"></div>

<!-- =========================================
VISTAS PÚBLICAS
========================================= -->
<div id="public-layout">
    <header>
        <div class="brand">Sistema Base<span style="color:var(--text-main)">.com</span></div>
        <nav>
            <ul>
                <li><a href="#" onclick="navigate('home')">Inicio</a></li>
                <li><a href="#" onclick="navigate('about')">Quiénes Somos</a></li>
                <li><a href="#" onclick="navigate('contact')">Contáctenos</a></li>
                <li><a href="#" onclick="navigate('login')" class="btn btn-primary" style="color: white; padding: 0.4rem 1rem;">Acceder</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <!-- Se inyectará el contenido dinámicamente aquí -->
    </main>

    <footer id="main-footer">
        <p>&copy; 2026 SistemaBase RETA Paulo. <strong>- Todos los derechos reservados. -</strong></p>
    </footer>
</div>

<!-- =========================================
    VISTAS PRIVADAS (DASHBOARD)
========================================= -->
<div id="private-layout" class="dashboard-layout hidden">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Admin Panel</div>
        <ul class="sidebar-nav">
            <li><a href="#" onclick="app.renderDashboard()" id="nav-dash" class="active">📊 Dashboard</a></li>
            <li><a href="#" onclick="app.renderUsers()" id="nav-users">👥 Usuarios</a></li>
            <li><a href="#" onclick="app.renderProducts()" id="nav-products">📦 Productos</a></li>
        </ul>
        <div class="sidebar-footer">
            <button onclick="app.logout()" class="btn btn-outline" style="width: 100%; border-color: #475569; color: #cbd5e1;">Cerrar Sesión</button>
        </div>
    </aside>

    <div class="dashboard-content">
        <div class="topbar">
            <button class="btn btn-outline" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display: none;" id="mobile-menu-btn">☰</button>
            <div class="user-info">
                <span id="user-name-display">Admin Usuario</span>
                <div class="avatar">A</div>
            </div>
        </div>
        
        <div class="content-area" id="admin-content">
            <!-- Contenido del Dashboard inyectado aquí -->
        </div>
    </div>
</div>

<!-- =========================================
      MODALES GENÉRICOS
      ========================================= -->
<div id="modal-container" class="modal-overlay hidden">
    <!-- Contenido del modal dinámico -->
</div>
<div class="toast-container" id="toastContainer"></div>

<!-- SCRIPTS -->
<!--  Lógica de Login y Cerrar Sesión -->
<script src="./js/script.js"></script>  


</body>
</html>
